[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "git-repo-manager"
dynamic = ["version"]
description = "A lightweight Tkinter desktop app for managing multiple Git repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rudolf Stepan"}]
keywords = ["git", "desktop", "tkinter", "repository", "bulk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.gui-scripts]
git-repo-manager = "git_repo_manager.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "git_repo_manager.__version__"}
